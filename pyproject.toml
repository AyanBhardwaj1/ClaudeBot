[project]
name = "claudebot"
version = "1.0.0"
description = "Your personal assistant on Telegram, powered by Claude: email, calendar, memory, reminders, research and documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic==1.15.0",
    "python-telegram-bot[job-queue]==22.8",
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
    "google-auth-httplib2==0.4.4",
    "python-dotenv==1.2.4",
    "matplotlib==3.11.2",
]

[project.scripts]
claudebot = "claudebot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claudebot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
